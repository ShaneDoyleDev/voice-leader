<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  :root{
    --bg:#EBEDF1;
    --surface:#FDFDFB;
    --ink:#1B2130;
    --ink-soft:#5B6274;
    --rule:#78808F;
    --accent:#A9701A;
    --accent-soft:rgba(169,112,26,.13);
    --line:#D8DBE2;
    --chip:#F1F2F5;
    --accent-faint:rgba(169,112,26,.06);
    --wrong:#B32D23;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141A; --surface:#1B1E25; --ink:#EAE7DF; --ink-soft:#A2A7B4;
      --rule:#8B93A4; --accent:#E0AA4C; --accent-soft:rgba(224,170,76,.16);
      --line:#2A2E38; --chip:#232730; --accent-faint:rgba(224,170,76,.07); --wrong:#F08579; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141A; --surface:#1B1E25; --ink:#EAE7DF; --ink-soft:#A2A7B4;
    --rule:#8B93A4; --accent:#E0AA4C; --accent-soft:rgba(224,170,76,.16);
    --line:#2A2E38; --chip:#232730; --accent-faint:rgba(224,170,76,.07); --wrong:#F08579; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:400 15px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:16px;
    padding-block:clamp(20px,5vw,44px);
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  h1{
    margin:0;
    font-family:"Spectral", Georgia, serif;
    font-weight:600; font-size:clamp(28px,5vw,40px);
    letter-spacing:-.01em; text-wrap:balance;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .field{
    padding:18px 18px 20px;
    border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:12px;
  }
  .field:last-of-type{border-bottom:none}
  .field > h2{
    margin:0;
    font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .row .spacer{flex:1 1 auto}

  button{
    font:500 13px/1 "IBM Plex Sans", sans-serif;
    color:var(--ink); background:var(--chip);
    border:1px solid var(--line); border-radius:3px;
    padding:8px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--rule)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button[aria-pressed="true"],button.on{
    background:var(--accent-soft); border-color:var(--accent);
  }
  button.ghost{background:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}

  .circlewrap{align-self:center;width:100%;max-width:360px}
  .circle{display:block;width:100%;height:auto}
  .sector{cursor:pointer;outline:none}
  .sector path{fill:var(--chip);stroke:var(--surface);stroke-width:1.5}
  .sector:hover path{fill:var(--accent-soft)}
  .sector.rel path{fill:var(--accent-faint)}
  .sector.sel path{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .sector:focus-visible path{stroke:var(--accent);stroke-width:2.5}
  .sector text{pointer-events:none;user-select:none;fill:var(--ink)}
  .sector .count{fill:var(--ink-soft)}
  @media (prefers-reduced-motion: no-preference){ .sector path{transition:fill .12s ease} }

  .keyline{
    margin:0; font-size:13px; color:var(--ink-soft);
  }
  .keyline b{color:var(--ink);font-weight:500}

  .numerals{display:flex;flex-wrap:wrap;gap:6px}
  .numerals button{
    font-family:"Spectral", Georgia, serif;
    font-size:17px; padding:8px 16px; letter-spacing:.03em;
  }
  .numerals button small{
    display:block; margin-top:3px;
    font:400 10px/1 "IBM Plex Sans",sans-serif;
    color:var(--ink-soft); letter-spacing:.02em;
  }

  .seq{
    display:flex; flex-wrap:wrap; align-items:stretch; gap:6px;
    min-height:62px; padding:8px;
    background:var(--chip); border-radius:3px;
  }
  .seq .slot{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:3px;
    font:500 13px/1 "IBM Plex Sans",sans-serif; cursor:pointer;
  }
  .seq .slot span{
    font-family:"Spectral", Georgia, serif; font-size:19px; letter-spacing:.03em;
  }
  .seq .slot small{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .seq .slot:hover{border-color:var(--accent)}
  .seq .none{
    align-self:center; margin:0 4px;
    color:var(--ink-soft); font-style:italic; font-size:13px;
  }

  .start{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:16px 18px;
  }
  .start button.go{
    background:var(--ink); color:var(--surface); border-color:var(--ink);
    font-size:14px; padding:11px 20px;
  }
  .start button.go:disabled{background:var(--chip);color:var(--ink-soft);border-color:var(--line)}
  .start p{margin:0;font-size:13px;color:var(--ink-soft)}

  .stagehead{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:10px;
  }
  .stagehead h2{
    margin:0; font-family:"Spectral",Georgia,serif;
    font-weight:600; font-size:22px;
  }
  .stagehead .prog{
    font-family:"Spectral",Georgia,serif; font-size:17px;
    color:var(--ink-soft); letter-spacing:.06em;
  }
  .stagehead .spacer{flex:1 1 auto}

  .staffwrap{
    display:block; padding:6px 4px 2px; cursor:crosshair;
    touch-action:none; outline:none;
    user-select:none; -webkit-user-select:none;   /* a double click removes, never selects */
  }
  .staffwrap:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
  svg{display:block;width:100%;height:auto}
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    padding:12px 14px; border-top:1px solid var(--line);
  }
  .toolbar .spacer{flex:1 1 auto}

  .readout{display:flex;flex-direction:column;gap:10px}
  .readout h2{
    margin:0; font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
  .chip{
    display:flex; align-items:baseline; gap:8px;
    padding:6px 10px; background:var(--chip); border-radius:3px;
    font-variant-numeric:tabular-nums;
  }
  .chip b{font:500 13px/1 "Spectral",Georgia,serif;color:var(--accent);letter-spacing:.04em}
  .chip span{font-family:"Spectral",Georgia,serif;font-size:15px;letter-spacing:.02em}
  .empty{margin:0;color:var(--ink-soft);font-style:italic}
  .hint{margin:0;font-size:13px;color:var(--ink-soft)}
  kbd{
    font:500 11px/1 "IBM Plex Sans",sans-serif;
    border:1px solid var(--line); border-bottom-width:2px;
    border-radius:3px; padding:2px 5px; background:var(--chip);
  }
  @media (prefers-reduced-motion: no-preference){ #ghost{transition:opacity .12s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Leader</h1>
  </header>

  <!-- ---------- setup ---------- -->
  <section class="panel" id="setup">
    <div class="field">
      <h2>Key</h2>
      <div class="circlewrap" id="circle"></div>
      <p class="keyline" id="keyline"></p>
    </div>

    <div class="field">
      <h2>Progression</h2>
      <div class="numerals" id="numerals"></div>
      <div class="seq" id="seq"></div>
      <p class="keyline" id="progline"></p>
      <div class="row">
        <span class="spacer"></span>
        <button type="button" class="ghost" id="undo">Undo</button>
        <button type="button" class="ghost" id="clearprog">Clear</button>
      </div>
    </div>

    <div class="start">
      <button type="button" class="go" id="begin">Begin voicing</button>
      <p id="startnote"></p>
    </div>
  </section>

  <!-- ---------- staff ---------- -->
  <section id="stage" hidden>
    <div class="stagehead">
      <h2 id="stagekey"></h2>
      <span class="prog" id="stageprog"></span>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="edit">Change key or progression</button>
    </div>

    <div class="panel" style="margin-top:12px">
      <div class="staffwrap" id="staffwrap" tabindex="0" role="application"
           aria-label="Grand staff. Arrow keys move the cursor, Enter places or removes a note.">
        <svg id="staff" viewBox="0 0 640 244" aria-hidden="true"></svg>
      </div>
      <div class="toolbar">
        <button type="button" id="btn-names" aria-pressed="false">Note names</button>
        <button type="button" id="btn-sound" aria-pressed="true">Sound</button>
        <span class="spacer"></span>
        <button type="button" id="btn-clear" class="ghost">Clear notes</button>
      </div>
    </div>

    <div class="readout" style="margin-top:20px">
      <h2>On the staff</h2>
      <ul class="chips" id="chips" aria-live="polite"></ul>
      <p class="hint">Click a line or a space to place a note, drag it to move it, double-click it to take it off.</p>
      <p class="hint">Keyboard: <kbd>Tab</kbd> to the staff, <kbd>←</kbd> <kbd>→</kbd> for chord, <kbd>↑</kbd> <kbd>↓</kbd> for pitch, <kbd>Enter</kbd> to place or remove.</p>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------- pitch model ---------------------------------------------
     A pitch is one diatonic step: step = octave * 7 + letter (C = 0), so
     middle C is 28 and one step is half a staff space. What a step sounds
     like depends on the key signature, and on the chord it sits under —
     the leading tone is raised in a minor V.                            */
  var LETTERS = ["C","D","E","F","G","A","B"];
  var SEMIS   = [0,2,4,5,7,9,11];
  var SHARP_ORDER = [3,0,4,1,5,2,6];   /* F C G D A E B */
  var FLAT_ORDER  = [6,2,5,1,4,0,3];   /* B E A D G C F */
  var ACC_TEXT = {"-2":"bb","-1":"♭","0":"","1":"♯","2":"x"};
  var ROMAN = ["I","II","III","IV","V","VI","VII"];
  var DEGREES = [1,2,3,4,5,6,7];

  var KEYS = {
    major:[["G♭",-6],["D♭",-5],["A♭",-4],["E♭",-3],["B♭",-2],["F",-1],
           ["C",0],["G",1],["D",2],["A",3],["E",4],["B",5],["F♯",6]],
    minor:[["E♭",-6],["B♭",-5],["F",-4],["C",-3],["G",-2],["D",-1],
           ["A",0],["E",1],["B",2],["F♯",3],["C♯",4],["G♯",5],["D♯",6]]
  };

  /* ---------- staff geometry -------------------------------------------- */
  var S = 12, HALF = S / 2;
  var TOP_STEP = 38, Y_TOP = 60;        /* F5 sits on the top treble line */
  var STAFF_L = 30, STAFF_R = 612, SIG_X = 92;
  var MIN_STEP = 16, MAX_STEP = 42;     /* E2 to C6 — the practical SATB span */
  var STAVES = { treble:{ top:38, bottom:30, mid:34 }, bass:{ top:26, bottom:18, mid:22 } };
  /* where each accidental of a key signature sits, in signature order */
  var SIG_STEPS = {
    sharp:{ treble:[38,35,39,36,33,37,34], bass:[24,21,25,22,19,23,20] },
    flat: { treble:[34,37,33,36,32,35,31], bass:[20,23,19,22,18,21,17] }
  };

  function yOf(step){ return Y_TOP + (TOP_STEP - step) * HALF; }
  function stepAt(y){ return clamp(Math.round(TOP_STEP - (y - Y_TOP) / HALF), MIN_STEP, MAX_STEP); }
  function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
  function ledgerCount(staff, step){
    var s = STAVES[staff];
    if (step > s.top) return Math.floor((step - s.top) / 2);
    if (step < s.bottom) return Math.floor((s.bottom - step) / 2);
    return 0;
  }
  function pickStaff(step, preferred){
    var t = ledgerCount("treble", step), b = ledgerCount("bass", step);
    return t < b ? "treble" : b < t ? "bass" : preferred;
  }

  /* ---------- key and chords --------------------------------------------- */
  var state = { mode:"major", tonic:"C", chords:[1,4,5,1], notes:[], live:"" };

  function keyAcc(){
    var list = KEYS[state.mode], i;
    for (i = 0; i < list.length; i++) if (list[i][0] === state.tonic) return list[i][1];
    return 0;
  }
  function keyAlters(){
    var acc = keyAcc(), a = [0,0,0,0,0,0,0], i;
    if (acc > 0) for (i = 0; i < acc; i++) a[SHARP_ORDER[i]] = 1;
    else for (i = 0; i < -acc; i++) a[FLAT_ORDER[i]] = -1;
    return a;
  }
  function tonicLetter(){ return LETTERS.indexOf(state.tonic.charAt(0)); }
  function leadingLetter(){ return (tonicLetter() + 6) % 7; }
  /* the chords that borrow the raised leading tone in minor: V and vii-dim.
     Everything else stays diatonic to the natural minor scale, so III keeps
     its lowered seventh and reads as a major triad.                       */
  function raisesLeadingTone(degree){
    return state.mode === "minor" && (degree === 5 || degree === 7);
  }
  /* quality is measured off the spelling, so it can never disagree with it */
  function quality(degree){
    var ls = chordLetters(degree);
    var semis = ls.map(function(l, i){
      var v = SEMIS[l] + alterFor(degree, l);
      return i === 0 ? v : v + (v < SEMIS[ls[0]] + alterFor(degree, ls[0]) ? 12 : 0);
    });
    var third = semis[1] - semis[0], fifth = semis[2] - semis[0];
    if (third === 4 && fifth === 8) return "aug";
    if (third === 3 && fifth === 6) return "dim";
    return third === 3 ? "min" : "maj";
  }
  function numeralOf(degree){
    var roman = ROMAN[degree - 1], q = quality(degree);
    if (q === "min" || q === "dim") roman = roman.toLowerCase();
    return roman + (q === "dim" ? "\u00B0" : q === "aug" ? "+" : "");
  }
  function alterFor(degree, letter){
    var base = keyAlters()[letter];
    return (raisesLeadingTone(degree) && letter === leadingLetter()) ? base + 1 : base;
  }
  function chordLetters(degree){
    var root = (tonicLetter() + degree - 1) % 7;
    return [root, (root + 2) % 7, (root + 4) % 7];
  }
  /* spell a letter under a chord; a raised leading tone that the signature
     flats is written with a natural, not a bare letter */
  function letterText(degree, letter){
    var a = alterFor(degree, letter), base = keyAlters()[letter];
    if (a === 0 && base !== 0) return LETTERS[letter] + "\u266E";
    return LETTERS[letter] + ACC_TEXT[String(a)];
  }
  function spell(degree){
    return chordLetters(degree).map(function(l){ return letterText(degree, l); }).join(" ");
  }
  function keyName(){ return state.tonic + " " + state.mode; }
  function sigCount(acc){
    var n = Math.abs(acc);
    if (!n) return "no sharps or flats";
    return n + (acc > 0 ? " sharp" : " flat") + (n > 1 ? "s" : "");
  }
  function sigList(acc){
    var n = Math.abs(acc), order = acc > 0 ? SHARP_ORDER : FLAT_ORDER, out = [], i;
    for (i = 0; i < n; i++) out.push(LETTERS[order[i]] + (acc > 0 ? "♯" : "♭"));
    return out.join(" ");
  }
  function sigText(){
    var acc = keyAcc();
    return acc ? sigCount(acc) + " — " + sigList(acc) : sigCount(acc);
  }
  function scaleText(){
    var t = tonicLetter(), alters = keyAlters(), out = [], i, l;
    for (i = 0; i < 7; i++){
      l = (t + i) % 7;
      out.push(LETTERS[l] + ACC_TEXT[String(alters[l])]);
    }
    return out.join(" ");
  }
  function nameAt(slot, step){
    return letterText(state.chords[slot], step % 7) + Math.floor(step / 7);
  }
  function freqAt(slot, step){
    var l = step % 7;
    var midi = (Math.floor(step / 7) + 1) * 12 + SEMIS[l] + alterFor(state.chords[slot], l);
    return 440 * Math.pow(2, (midi - 69) / 12);
  }
  /* an accidental is printed only when the chord departs from the signature */
  function printedAccidental(slot, step){
    var l = step % 7, base = keyAlters()[l], a = alterFor(state.chords[slot], l);
    if (a === base) return null;
    return a === 0 ? "natural" : a === 1 ? "sharp" : a === 2 ? "dblsharp" : "flat";
  }

  /* horizontal position of each chord, cleared of the key signature */
  var SLOT_X = [];
  function layoutSlots(){
    var n = state.chords.length, first = SIG_X + sigWidth(S) + 34, last = 578, xs = [], i;
    if (n === 1) return [(first + last) / 2];
    var gap = Math.min((last - first) / (n - 1), 108);
    var start = first + ((last - first) - gap * (n - 1)) / 2;
    for (i = 0; i < n; i++) xs.push(start + i * gap);
    return xs;
  }
  function slotAt(x){
    var best = 0, bd = Infinity, i, d;
    for (i = 0; i < SLOT_X.length; i++){
      d = Math.abs(x - SLOT_X[i]);
      if (d < bd){ bd = d; best = i; }
    }
    return best;
  }

  /* ---------- calligraphic strokes ---------------------------------------
     Clefs, brace and accidentals are filled outlines around a sampled
     spine, so a stroke can swell and taper the way a nib does.           */
  function cubic(p0,p1,p2,p3,n){
    var out = [], i, t, u;
    for (i = 0; i <= n; i++){
      t = i / n; u = 1 - t;
      out.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0],
                u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]);
    }
    return out;
  }
  function widthFn(keys){
    return function(t){
      for (var i = 1; i < keys.length; i++){
        if (t <= keys[i][0]){
          var a = keys[i-1], b = keys[i], f = (t - a[0]) / (b[0] - a[0] || 1);
          return a[1] + (b[1] - a[1]) * f;
        }
      }
      return keys[keys.length-1][1];
    };
  }
  function ribbon(pts, w){
    var left = [], right = [], n = pts.length, i;
    for (i = 0; i < n; i++){
      var p = pts[i], a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
      var tx = b[0]-a[0], ty = b[1]-a[1], len = Math.hypot(tx,ty) || 1;
      var nx = -ty/len, ny = tx/len, h = w(i/(n-1)) / 2;
      left.push([p[0]+nx*h, p[1]+ny*h]);
      right.push([p[0]-nx*h, p[1]-ny*h]);
    }
    return "M" + left.map(function(p){ return p[0].toFixed(3)+","+p[1].toFixed(3); }).join("L") +
           "L" + right.reverse().map(function(p){ return p[0].toFixed(3)+","+p[1].toFixed(3); }).join("L") + "Z";
  }

  /* Notation glyphs — clefs, accidentals and the notehead — are outlines
     extracted from Bravura (Steinberg, SIL Open Font License 1.1), the
     reference SMuFL font. Coordinates are font units, 250 to a staff space,
     y upwards, and a glyph's origin is its left edge on the line or space it
     belongs to: the G line for the treble clef, the F line for the bass, the
     note's own pitch for a notehead or an accidental. So each one is placed
     by translating there and scaling by space/250 with y flipped. */
  var GLYPH_UPEM = 250;
  var GLYPH = {
    gClef: "M376 415C374 427 376 428 382 434C398 449 419 470 438 491C522 583 572 702 572 815C572 902 548 988 507 1048C492 1070 466 1098 455 1098C441 1098 410 1072 390 1050C316 968 292 843 292 739C292 681 299 616 306 575C308 563 309 561 297 551C233 498 164 437 112 373C43 287 0 194 0 87C0 -87 119 -252 364 -252C387 -252 413 -250 433 -246C444 -244 446 -243 448 -255C460 -322 475 -409 475 -456C475 -604 375 -622 316 -622C262 -622 236 -606 236 -593C236 -586 245 -583 268 -576C299 -567 335 -540 335 -482C335 -427 300 -380 239 -380C172 -380 132 -433 132 -495C132 -560 171 -658 322 -658C389 -658 519 -628 519 -458C519 -401 501 -306 490 -244C488 -232 489 -233 503 -227C604 -187 671 -102 671 11C671 139 577 252 430 252C404 252 404 252 401 270ZM470 943C503 943 530 916 530 861C530 792 497 728 419 650C403 634 379 611 356 591C349 585 345 586 343 599C339 625 337 659 337 691C337 847 409 943 470 943ZM361 262C364 243 364 244 346 238C258 208 201 129 201 44C201 -46 248 -110 316 -133C324 -136 336 -139 343 -139C351 -139 355 -134 355 -128C355 -121 347 -118 340 -115C298 -97 268 -54 268 -8C268 49 307 92 368 109C384 113 386 112 388 101L438 -197C440 -208 439 -208 424 -211C408 -214 388 -216 368 -216C193 -216 80 -119 80 20C80 79 90 158 173 252C233 319 279 356 326 394C336 402 338 401 340 390ZM430 103C428 115 429 118 441 117C522 110 589 42 589 -46C589 -109 551 -160 495 -188C483 -194 481 -194 479 -182Z",

  var begin = document.getElementById("begin"), startnote = document.getElementById("startnote");
  var MAX_CHORDS = 8;

  /* ---- circle of fifths ---------------------------------------------------
     Twelve wedges, a fifth apart clockwise: majors outside, their relative
     minors inside. Six o'clock carries the enharmonic pair, so clicking the
     wedge you are already on flips its spelling.                          */
  var CIRCLE = [
    {maj:["C"],            min:["A"]},
    {maj:["G"],            min:["E"]},
    {maj:["D"],            min:["B"]},
    {maj:["A"],            min:["F♯"]},
    {maj:["E"],            min:["C♯"]},
    {maj:["B"],            min:["G♯"]},
    {maj:["F♯","G♭"], min:["D♯","E♭"]},
    {maj:["D♭"],           min:["B♭"]},
    {maj:["A♭"],           min:["F"]},
    {maj:["E♭"],           min:["C"]},
    {maj:["B♭"],           min:["G"]},
    {maj:["F"],            min:["D"]}
  ];
  var CX = 160, CY = 160;

  function polar(r, deg){
    var a = deg * Math.PI / 180;
    return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  }
  function wedge(rOut, rIn, i){
    var a0 = i*30 - 15, a1 = i*30 + 15;
    return "M" + polar(rOut,a0) + "A" + rOut + "," + rOut + " 0 0 1 " + polar(rOut,a1) +
           "L" + polar(rIn,a1) + "A" + rIn + "," + rIn + " 0 0 0 " + polar(rIn,a0) + "Z";
  }
  function circlePos(){
    for (var i = 0; i < CIRCLE.length; i++)
      if (CIRCLE[i][state.mode === "major" ? "maj" : "min"].indexOf(state.tonic) > -1) return i;
    return 0;
  }
  function chooseKey(mode, names){
    var at = names.indexOf(state.tonic);
    if (state.mode === mode && at > -1 && names.length > 1) state.tonic = names[(at + 1) % names.length];
    else { state.mode = mode; state.tonic = names[0]; }
    drawSetup();
  }
  function accOf(mode, name){
    var list = KEYS[mode], i;
    for (i = 0; i < list.length; i++) if (list[i][0] === name) return list[i][1];
    return 0;
  }
  /* the key signature as notation: clef plus its accidentals on a small stave */
  function miniStave(acc){
    var g = el("g",{role:"img","aria-label":"Key signature: " + sigCount(acc)});
    var sp = 6, top = 162, n = Math.abs(acc), kind = acc > 0 ? "sharp" : "flat";
    var wClef = glyphW("gClef", sp), wAcc = glyphW(kind, sp) + 1, i;
    var left = CX - (wClef + n * wAcc) / 2;
    for (i = 0; i < 5; i++)
      g.appendChild(el("line",{x1:left - 4, y1:top + i*sp, x2:left + wClef + n*wAcc + 4, y2:top + i*sp,
                               stroke:"var(--rule)", "stroke-width":0.7}));
    g.appendChild(glyph("gClef", left, top + 3*sp, sp, "var(--ink)"));   /* G line */
    for (i = 0; i < n; i++)
      g.appendChild(glyph(kind, left + wClef + 2 + i*wAcc,
                          top + (38 - SIG_STEPS[kind].treble[i]) * sp / 2, sp, "var(--ink)"));
    return g;
  }
  function drawCircle(){
    circle.innerHTML = "";
    var here = circlePos();
    var svgC = el("svg",{viewBox:"0 0 320 320", "class":"circle", role:"group",
                         "aria-label":"Circle of fifths — choose a key"});
    CIRCLE.forEach(function(pos, i){
      [["major",150,108,pos.maj,15,""],["minor",104,64,pos.min,12.5,"m"]].forEach(function(ring){
        var mode = ring[0], names = ring[3];
        var name = names.indexOf(state.tonic) > -1 ? state.tonic : names[0];
        var sel = state.mode === mode && names.indexOf(state.tonic) > -1;
        var acc = accOf(mode, name), mid = (ring[1] + ring[2]) / 2;
        var g = el("g",{ "class":"sector" + (sel ? " sel" : (i === here ? " rel" : "")),
                         tabindex:0, role:"button", "aria-pressed":String(sel),
                         "aria-label":name + " " + mode + ", " + sigCount(acc) });
        g.appendChild(el("path",{d:wedge(ring[1], ring[2], i)}));
        /* names and counts stack in screen space, not along the radius, so
           they never crowd each other on the wedges out at the sides */
        var lp = polar(mid, i*30);
        function text(str, dy, size, cls){
          var t = el("text",{x:lp[0], y:lp[1] + dy, "text-anchor":"middle", "font-size":size,
                             "font-family":cls ? "IBM Plex Sans, sans-serif" : "Spectral, Georgia, serif"});
          if (cls) t.setAttribute("class", cls);
          t.textContent = str;
          g.appendChild(t);
        }
        if (names.length > 1){                       /* the enharmonic wedge */
          text(names[0] + ring[5], -4, ring[4] - 2.5);
          text(names[1] + ring[5], 11, ring[4] - 2.5);
        } else {
          text(name + ring[5], mode === "major" ? -1 : 4, ring[4]);
          if (mode === "major")
            text(acc === 0 ? "—" : Math.abs(acc) + (acc > 0 ? "♯" : "♭"), 13, 9, "count");
        }
        g.addEventListener("click", function(){ chooseKey(mode, names); });
        g.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " "){ e.preventDefault(); chooseKey(mode, names); }
        });
        svgC.appendChild(g);
      });
    });
    /* hub: the key, and its signature written out on a small treble stave */
    svgC.appendChild(el("circle",{cx:CX, cy:CY, r:60, fill:"var(--surface)", stroke:"var(--line)"}));
    var t = el("text",{x:CX, y:140, "text-anchor":"middle", "font-size":17,
                       "font-family":"Spectral, Georgia, serif", fill:"var(--ink)"});
    t.textContent = keyName();
    svgC.appendChild(t);
    svgC.appendChild(miniStave(keyAcc()));
    circle.appendChild(svgC);
  }
  function drawNumerals(){
    numerals.innerHTML = "";
    DEGREES.forEach(function(degree){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = numeralOf(degree) + "<small>" + spell(degree) + "</small>";
      b.disabled = state.chords.length >= MAX_CHORDS;
      b.addEventListener("click", function(){
        if (state.chords.length < MAX_CHORDS){ state.chords.push(degree); drawSetup(); }
      });
      numerals.appendChild(b);
    });
  }
  function drawSeq(){
    seq.innerHTML = "";
    if (!state.chords.length){
      var p = document.createElement("span");
      p.className = "none";
      p.textContent = "Tap a numeral above to start the progression.";
      seq.appendChild(p);
      return;
    }
    state.chords.forEach(function(degree, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "slot";
      b.title = "Remove this chord";
      b.innerHTML = "<span>" + numeralOf(degree) + "</span><small>" + spell(degree) + "</small>";
      b.addEventListener("click", function(){ state.chords.splice(i,1); drawSetup(); });
      seq.appendChild(b);
    });
  }
  function drawSetup(){
    /* keep the tonic legal when the mode flips */
    var names = KEYS[state.mode].map(function(k){ return k[0]; });
    if (names.indexOf(state.tonic) === -1) state.tonic = state.mode === "major" ? "C" : "A";
    drawCircle(); drawNumerals(); drawSeq();
    var progline = document.getElementById("progline");
    progline.hidden = state.mode !== "minor";
    progline.innerHTML = "<b>V</b> and <b>vii\u00B0</b> raise the leading tone; the rest stay diatonic to the natural minor scale.";
    /* relative keys share a signature, so pick the spelling that matches it:
       G-flat major pairs with E-flat minor, F-sharp major with D-sharp minor */
    var relMode = state.mode === "major" ? "minor" : "major";
    var cands = CIRCLE[circlePos()][relMode === "major" ? "maj" : "min"];
    var relName = cands.filter(function(n){ return accOf(relMode, n) === keyAcc(); })[0] || cands[0];
    var rel = relName + " " + relMode;
    keyline.innerHTML = "Scale: <b>" + scaleText() + "</b> · Relative " + rel +
      (CIRCLE[circlePos()].maj.length > 1 ? " · Click the same wedge again for the other spelling." : "");
    begin.disabled = state.chords.length < 2;
    startnote.textContent = state.chords.length < 2
      ? "Pick at least two chords."
      : state.chords.length + " chords — " + state.chords.map(numeralOf).join(" – ") +
        " in " + keyName() + ".";
  }

  document.getElementById("undo").addEventListener("click", function(){ state.chords.pop(); drawSetup(); });
  document.getElementById("clearprog").addEventListener("click", function(){ state.chords = []; drawSetup(); });

  begin.addEventListener("click", function(){
    var sig = state.mode + "|" + state.tonic + "|" + state.chords.join(",");
    if (sig !== state.live){ state.notes = []; state.live = sig; }   /* a changed setup starts clean */
    SLOT_X = layoutSlots();
    cursor = { slot:0, step:30, staff:"treble" };
    document.getElementById("stagekey").textContent = keyName();
    document.getElementById("stageprog").textContent = state.chords.map(numeralOf).join(" – ");
    setup.hidden = true;
    stage.hidden = false;
    drawStaff();
    render();
    wrap.focus({preventScroll:true});
  });
  document.getElementById("edit").addEventListener("click", function(){
    stage.hidden = true;
    setup.hidden = false;
    drawSetup();
  });

  /* ---------- toolbar --------------------------------------------------------- */
  var btnNames = document.getElementById("btn-names"), btnSound = document.getElementById("btn-sound");
  btnNames.addEventListener("click", function(){
    showNames = !showNames;
    btnNames.setAttribute("aria-pressed", String(showNames));
    render();
  });
  btnSound.addEventListener("click", function(){
    soundOn = !soundOn;
    btnSound.setAttribute("aria-pressed", String(soundOn));
  });
  document.getElementById("btn-clear").addEventListener("click", function(){
    state.notes = [];
    render();
  });

  drawSetup();
})();
</script>
</body>
</html>
