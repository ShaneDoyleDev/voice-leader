<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap">
<style>
  :root{
    --bg:#EBEDF1;
    --surface:#FDFDFB;
    --ink:#1B2130;
    --ink-soft:#5B6274;
    --rule:#78808F;
    --accent:#A9701A;
    --accent-soft:rgba(169,112,26,.13);
    --line:#D8DBE2;
    --chip:#F1F2F5;
    --accent-faint:rgba(169,112,26,.06);
    --wrong:#B32D23;
    --good:#2C6E4F;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12141A; --surface:#1B1E25; --ink:#EAE7DF; --ink-soft:#A2A7B4;
      --rule:#8B93A4; --accent:#E0AA4C; --accent-soft:rgba(224,170,76,.16);
      --line:#2A2E38; --chip:#232730; --accent-faint:rgba(224,170,76,.07); --wrong:#F08579; --good:#7CC79E; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12141A; --surface:#1B1E25; --ink:#EAE7DF; --ink-soft:#A2A7B4;
    --rule:#8B93A4; --accent:#E0AA4C; --accent-soft:rgba(224,170,76,.16);
    --line:#2A2E38; --chip:#232730; --accent-faint:rgba(224,170,76,.07); --wrong:#F08579; --good:#7CC79E; color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font:400 15px/1.55 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  [hidden]{display:none!important}

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:16px;
    padding-block:clamp(20px,5vw,44px);
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  h1{
    margin:0;
    font-family:"Spectral", Georgia, serif;
    font-weight:600; font-size:clamp(28px,5vw,40px);
    letter-spacing:-.01em; text-wrap:balance; text-align:center;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
  }
  .field{
    padding:18px 18px 20px;
    border-bottom:1px solid var(--line);
    display:flex; flex-direction:column; gap:12px;
  }
  .field:last-of-type{border-bottom:none}
  .field > h2{
    margin:0;
    font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .row .spacer{flex:1 1 auto}

  button{
    font:500 13px/1 "IBM Plex Sans", sans-serif;
    color:var(--ink); background:var(--chip);
    border:1px solid var(--line); border-radius:3px;
    padding:8px 12px; cursor:pointer;
  }
  button:hover{border-color:var(--rule)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button[aria-pressed="true"],button.on{
    background:var(--accent-soft); border-color:var(--accent);
  }
  button.ghost{background:transparent}
  button:disabled{opacity:.45;cursor:not-allowed}

  .circlewrap{align-self:center;width:100%;max-width:360px}
  .circle{display:block;width:100%;height:auto}
  .sector{cursor:pointer;outline:none}
  .sector path{fill:var(--chip);stroke:var(--surface);stroke-width:1.5}
  .sector:hover path{fill:var(--accent-soft)}
  .sector.rel path{fill:var(--accent-faint)}
  .sector.sel path{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
  .sector:focus-visible path{stroke:var(--accent);stroke-width:2.5}
  .sector text{pointer-events:none;user-select:none;fill:var(--ink)}
  .sector .count{fill:var(--ink-soft)}
  @media (prefers-reduced-motion: no-preference){ .sector path{transition:fill .12s ease} }

  .keyline{
    margin:0; font-size:13px; color:var(--ink-soft);
  }
  .keyline b{color:var(--ink);font-weight:500}
  #keyline{text-align:center;text-wrap:balance}   /* sits under the circle */

  .numerals{display:flex;flex-wrap:wrap;gap:6px}
  .numerals button{
    font-family:"Spectral", Georgia, serif;
    font-size:17px; padding:8px 16px; letter-spacing:.03em;
  }
  .numerals button small{
    display:block; margin-top:3px;
    font:400 10px/1 "IBM Plex Sans",sans-serif;
    color:var(--ink-soft); letter-spacing:.02em;
  }

  .drills{display:flex;flex-wrap:wrap;gap:8px}
  .drills button{
    flex:1 1 220px; text-align:left;
    font:500 14px/1.1 "Spectral",Georgia,serif; padding:11px 14px;
  }
  .drills button small{
    display:block; margin-top:4px;
    font:400 11px/1.35 "IBM Plex Sans",sans-serif; color:var(--ink-soft);
  }
  .task{                                 /* what a drill is asking for */
    margin:0; padding:11px 14px; border-bottom:1px solid var(--line);
    font-size:13px; color:var(--ink-soft);
  }
  .task b{color:var(--ink);font-weight:600}

  .seq{
    display:flex; flex-wrap:wrap; align-items:stretch; gap:6px;
    min-height:62px; padding:8px;
    background:var(--chip); border-radius:3px;
  }
  .seq .slot{
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:6px 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:3px;
    font:500 13px/1 "IBM Plex Sans",sans-serif; cursor:pointer;
  }
  .seq .slot span{
    font-family:"Spectral", Georgia, serif; font-size:19px; letter-spacing:.03em;
  }
  .seq .slot small{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  .seq .slot:hover{border-color:var(--accent)}
  .seq .none{
    align-self:center; margin:0 4px;
    color:var(--ink-soft); font-style:italic; font-size:13px;
  }

  .start{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:16px 18px; border-bottom:1px solid var(--line);
  }
  .start button.go{
    background:var(--ink); color:var(--surface); border-color:var(--ink);
    font-size:14px; padding:11px 20px;
  }
  .start button.go:disabled{background:var(--chip);color:var(--ink-soft);border-color:var(--line)}
  .start p{margin:0;font-size:13px;color:var(--ink-soft)}

  .stagehead{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:10px;
  }
  .stagehead h2{
    margin:0; font-family:"Spectral",Georgia,serif;
    font-weight:600; font-size:22px;
  }
  .stagehead .prog{
    font-family:"Spectral",Georgia,serif; font-size:17px;
    color:var(--ink-soft); letter-spacing:.06em;
  }
  .stagehead .spacer{flex:1 1 auto}

  .staffwrap{
    display:block; padding:6px 4px 2px; cursor:crosshair;
    touch-action:none; outline:none;
    user-select:none; -webkit-user-select:none;   /* a double click removes, never selects */
  }
  .staffwrap:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
  svg{display:block;width:100%;height:auto}
  .toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    padding:12px 14px; border-top:1px solid var(--line);
  }
  .toolbar .spacer{flex:1 1 auto}
  .tempo{                                /* how long Play holds each chord */
    display:flex; align-items:center; gap:9px; margin-left:2px;
    font:600 11px/1 "IBM Plex Sans",sans-serif; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .tempo input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:104px; height:3px; margin:0; padding:0;
    background:var(--line); border-radius:2px; cursor:pointer;
  }
  .tempo input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:13px; height:13px; border:0;
    border-radius:50%; background:var(--accent); cursor:pointer;
  }
  .tempo input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border:0; border-radius:50%;
    background:var(--accent); cursor:pointer;
  }
  .tempo input[type="range"]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tempo output{
    min-width:56px; color:var(--ink); letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
  }

  .checkbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    padding:12px 14px; border-top:1px solid var(--line);
  }
  .checkbar p{margin:0;font-size:13px;color:var(--ink-soft)}
  .checkbar button{
    background:var(--ink); color:var(--surface); border-color:var(--ink);
    font-size:14px; padding:10px 18px;
  }

  .results{display:flex;flex-direction:column;gap:14px}
  .results h2{
    margin:0; font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .verdict{margin:0;font-family:"Spectral",Georgia,serif;font-size:19px;color:var(--ink)}
  .findings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .block{
    display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:baseline;
    padding:9px 12px; border-radius:3px;
  }
  .findings > li:nth-child(even){background:var(--chip)}   /* banded, for the eye */
  .block > b{
    font-family:"Spectral",Georgia,serif; font-size:17px;
    color:var(--ink); letter-spacing:.04em; white-space:nowrap;
  }
  .block > b small{
    display:block; font:400 10px/1.4 "IBM Plex Sans",sans-serif;
    color:var(--ink-soft); letter-spacing:.02em;
  }
  .block ul{grid-column:2;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  .block li{position:relative;padding-left:17px;font-size:13.5px;color:var(--ink-soft);max-width:70ch}
  .block li::before{
    content:""; position:absolute; left:0; top:.42em;
    width:7px; height:7px; border-radius:50%;
  }
  .block li.error{color:var(--ink)}
  .block li b{color:var(--ink);font-weight:600}   /* the interval itself */
  .block li.error::before{background:var(--wrong)}
  .block li.caution::before{background:var(--accent)}
  .block li.ok::before{background:var(--good)}

  .readout{display:flex;flex-direction:column;gap:10px}
  .readout h2{
    margin:0; font-size:11px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-soft);
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
  .chips li{display:flex}
  button.chip{                           /* it plays its chord; inert until the chord is right */
    border:0; margin:0; color:inherit; font:inherit; text-align:left; cursor:pointer;
    transition:background .12s ease;
  }
  button.chip:disabled{cursor:default;opacity:1}
  button.chip:not(:disabled):hover,
  button.chip.playing{background:var(--accent-soft)}
  button.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip{
    display:flex; align-items:baseline; gap:8px;
    padding:6px 10px; background:var(--chip); border-radius:3px;
    font-variant-numeric:tabular-nums;
  }
  .chip b{font:500 13px/1 "Spectral",Georgia,serif;color:var(--accent);letter-spacing:.04em}
  .fig{                                  /* a figured-bass number, stacked */
    display:inline-flex; flex-direction:column; align-items:center;
    font-size:.58em; line-height:1.02; vertical-align:.42em; margin-left:1px;
  }
  .fig i{font-style:normal}
  .chip span{font-family:"Spectral",Georgia,serif;font-size:15px;letter-spacing:.02em}
  .chip .voiced + .voiced{margin-left:9px}
  .chip .voiced i{
    font:600 9px/1 "IBM Plex Sans",sans-serif; font-style:normal;
    color:var(--ink-soft); letter-spacing:.08em; margin-right:3px; vertical-align:.32em;
  }
  .empty{margin:0;color:var(--ink-soft);font-style:italic}
  @media (prefers-reduced-motion: no-preference){ #ghost{transition:opacity .12s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Leader</h1>
  </header>

  <!-- ---------- setup ---------- -->
  <section class="panel" id="setup">
    <div class="field">
      <h2>Key</h2>
      <div class="circlewrap" id="circle"></div>
      <p class="keyline" id="keyline"></p>
    </div>

    <div class="field">
      <h2>Progression</h2>
      <div class="numerals" id="numerals"></div>
      <div class="seq" id="seq"></div>
      <p class="keyline" id="progline"></p>
      <div class="row">
        <span class="spacer"></span>
        <button type="button" class="ghost" id="undo">Undo</button>
        <button type="button" class="ghost" id="clearprog">Clear</button>
      </div>
    </div>

    <div class="start">
      <button type="button" class="go" id="begin">Begin voicing</button>
      <p id="startnote"></p>
    </div>

    <div class="field">
      <h2>Exercises</h2>
      <div class="drills">
        <button type="button" id="drill-bass">Figured bass
          <small>A bass line is written for you — add the tenor, alto and soprano above it.</small></button>
        <button type="button" id="drill-sop">Harmonise a melody
          <small>A soprano line is written for you — set the alto, tenor and bass under it.</small></button>
      </div>
      <p class="keyline">The key and the progression come with it. The given voice is fixed on the
        staff; everything else is yours to write, and the checklist grades it the same way.</p>
    </div>
  </section>

  <!-- ---------- staff ---------- -->
  <section id="stage" hidden>
    <div class="stagehead">
      <h2 id="stagekey"></h2>
      <span class="prog" id="stageprog"></span>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="again" hidden>Another drill</button>
      <button type="button" class="ghost" id="edit">Change key or progression</button>
    </div>

    <div class="panel" style="margin-top:12px">
      <p class="task" id="stagetask" hidden></p>
      <div class="staffwrap" id="staffwrap" tabindex="0" role="application"
           aria-label="Grand staff. Arrow keys move the cursor, Enter places or removes a note.">
        <svg id="staff" viewBox="0 0 640 256" aria-hidden="true"></svg>
      </div>
      <div class="toolbar">
        <button type="button" id="play">Play</button>
        <label class="tempo" for="tempo">Tempo
          <input type="range" id="tempo" min="40" max="168" step="2" value="60">
          <output id="tempoval" for="tempo">60 bpm</output>
        </label>
        <span class="spacer"></span>
        <button type="button" id="btn-clear" class="ghost">Clear notes</button>
      </div>
      <div class="checkbar">
        <button type="button" id="check" hidden>Check voice leading</button>
        <p id="checkhint"></p>
      </div>
    </div>

    <section class="results" id="results" style="margin-top:20px" hidden>
      <h2>Checklist</h2>
      <p class="verdict" id="verdict"></p>
      <ul class="findings" id="findings"></ul>
    </section>

    <div class="readout" style="margin-top:20px">
      <h2>On the staff</h2>
      <ul class="chips" id="chips" aria-live="polite"></ul>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------- pitch model ---------------------------------------------
     A pitch is one diatonic step: step = octave * 7 + letter (C = 0), so
     middle C is 28 and one step is half a staff space. What a step sounds
     like depends on the key signature, and on the chord it sits under —
     the leading tone is raised in a minor V.                            */
  var LETTERS = ["C","D","E","F","G","A","B"];
  var SEMIS   = [0,2,4,5,7,9,11];
  var SHARP_ORDER = [3,0,4,1,5,2,6];   /* F C G D A E B */
  var FLAT_ORDER  = [6,2,5,1,4,0,3];   /* B E A D G C F */
  var ACC_TEXT = {"-2":"bb","-1":"♭","0":"","1":"♯","2":"x"};
  var ROMAN = ["I","II","III","IV","V","VI","VII"];
  var DEGREES = [1,2,3,4,5,6,7];

  var KEYS = {
    major:[["G♭",-6],["D♭",-5],["A♭",-4],["E♭",-3],["B♭",-2],["F",-1],
           ["C",0],["G",1],["D",2],["A",3],["E",4],["B",5],["F♯",6]],
    minor:[["E♭",-6],["B♭",-5],["F",-4],["C",-3],["G",-2],["D",-1],
           ["A",0],["E",1],["B",2],["F♯",3],["C♯",4],["G♯",5],["D♯",6]]
  };

  /* ---------- staff geometry -------------------------------------------- */
  var S = 12, HALF = S / 2;
  var STAFF_L = 30, STAFF_R = 612, SIG_X = 92;
  /* Each staff carries its own top line and the y it is drawn at, so the two
     can sit any distance apart. A pitch therefore has no single height: with
     the staves further apart than the two spaces that would put middle C
     exactly between them, middle C below the treble and middle C above the
     bass are different heights. Every position is a step plus its staff.
     Between them the two staves cover E2 to C6, the practical SATB span. */
  var STAVES = {
    treble:{ top:38, bottom:30, mid:34, topY:60,  lowest:28, highest:42 },   /* C4 to C6 */
    bass:  { top:26, bottom:18, mid:22, topY:144, lowest:16, highest:28 }    /* E2 to C4 */
  };
  var MID_Y = (STAVES.treble.topY + 4 * S + STAVES.bass.topY) / 2;
  /* where each accidental of a key signature sits, in signature order */
  var SIG_STEPS = {
    sharp:{ treble:[38,35,39,36,33,37,34], bass:[24,21,25,22,19,23,20] },
    flat: { treble:[34,37,33,36,32,35,31], bass:[20,23,19,22,18,21,17] }
  };

  function yOf(step, staff){
    var s = STAVES[staff || (step >= 28 ? "treble" : "bass")];
    return s.topY + (s.top - step) * HALF;
  }
  function stepAt(y, staff){
    var s = STAVES[staff];
    return clamp(Math.round(s.top - (y - s.topY) / HALF), s.lowest, s.highest);
  }
  function staffAt(y){ return y < MID_Y ? "treble" : "bass"; }
  function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
  function ledgerCount(staff, step){
    var s = STAVES[staff];
    if (step > s.top) return Math.floor((step - s.top) / 2);
    if (step < s.bottom) return Math.floor((s.bottom - step) / 2);
    return 0;
  }

  /* ---------- key and chords --------------------------------------------- */
  var state = { mode:"major", tonic:"C", chords:[1,4,5,1], notes:[], live:"", drill:null };

  function keyAcc(){
    var list = KEYS[state.mode], i;
    for (i = 0; i < list.length; i++) if (list[i][0] === state.tonic) return list[i][1];
    return 0;
  }
  function keyAlters(){
    var acc = keyAcc(), a = [0,0,0,0,0,0,0], i;
    if (acc > 0) for (i = 0; i < acc; i++) a[SHARP_ORDER[i]] = 1;
    else for (i = 0; i < -acc; i++) a[FLAT_ORDER[i]] = -1;
    return a;
  }
  function tonicLetter(){ return LETTERS.indexOf(state.tonic.charAt(0)); }
  function leadingLetter(){ return (tonicLetter() + 6) % 7; }
  /* the chords that borrow the raised leading tone in minor: V and vii-dim.
     Everything else stays diatonic to the natural minor scale, so III keeps
     its lowered seventh and reads as a major triad.                       */
  function raisesLeadingTone(degree){
    return state.mode === "minor" && (degree === 5 || degree === 7);
  }
  /* quality is measured off the spelling, so it can never disagree with it */
  function quality(degree){
    var ls = chordLetters(degree);
    var semis = ls.map(function(l, i){
      var v = SEMIS[l] + alterFor(degree, l);
      return i === 0 ? v : v + (v < SEMIS[ls[0]] + alterFor(degree, ls[0]) ? 12 : 0);
    });
    var third = semis[1] - semis[0], fifth = semis[2] - semis[0];
    if (third === 4 && fifth === 8) return "aug";
    if (third === 3 && fifth === 6) return "dim";
    return third === 3 ? "min" : "maj";
  }
  function numeralOf(degree){
    var roman = ROMAN[degree - 1], q = quality(degree);
    if (q === "min" || q === "dim") roman = roman.toLowerCase();
    return roman + (q === "dim" ? "\u00B0" : q === "aug" ? "+" : "");
  }
  function alterFor(degree, letter){
    var base = keyAlters()[letter];
    return (raisesLeadingTone(degree) && letter === leadingLetter()) ? base + 1 : base;
  }
  function chordLetters(degree){
    var root = (tonicLetter() + degree - 1) % 7;
    return [root, (root + 2) % 7, (root + 4) % 7];
  }
  /* spell a letter under a chord; a raised leading tone that the signature
     flats is written with a natural, not a bare letter */
  function letterText(degree, letter){
    var a = alterFor(degree, letter), base = keyAlters()[letter];
    if (a === 0 && base !== 0) return LETTERS[letter] + "\u266E";
    return LETTERS[letter] + ACC_TEXT[String(a)];
  }
  function spell(degree){
    return chordLetters(degree).map(function(l){ return letterText(degree, l); }).join(" ");
  }
  function keyName(){ return state.tonic + " " + state.mode; }
  function sigCount(acc){
    var n = Math.abs(acc);
    if (!n) return "no sharps or flats";
    return n + (acc > 0 ? " sharp" : " flat") + (n > 1 ? "s" : "");
  }
  function sigList(acc){
    var n = Math.abs(acc), order = acc > 0 ? SHARP_ORDER : FLAT_ORDER, out = [], i;
    for (i = 0; i < n; i++) out.push(LETTERS[order[i]] + (acc > 0 ? "♯" : "♭"));
    return out.join(" ");
  }
  function sigText(){
    var acc = keyAcc();
    return acc ? sigCount(acc) + " — " + sigList(acc) : sigCount(acc);
  }
  function scaleText(){
    var t = tonicLetter(), alters = keyAlters(), out = [], i, l;
    for (i = 0; i < 7; i++){

    fading.notes.forEach(function(n){
      if (SLOT_X[n.slot] == null) return;
      var g = noteGroup(n, {color:"var(--ink)", pop:false, opacity:(1 - ease).toFixed(3)});
      g.setAttribute("transform", "translate(0," + (-13 * ease).toFixed(2) + ")");
      layerGhost.appendChild(g);
    });
  }

  /* a thin ring that widens off the new notehead and fades as it goes */
  function drawRipple(){
    if (!popping || SLOT_X[popping.slot] == null) return;
    var t = Math.min(1, (performance.now() - popping.at) / RIPPLE_MS);
    var ease = 1 - Math.pow(1 - t, 2);
    layerGhost.appendChild(el("circle",{
      cx:SLOT_X[popping.slot], cy:yOf(popping.step, popping.staff),
      r:(5 + 17 * ease).toFixed(2), fill:"none",
      stroke:"var(--accent)", "stroke-width":1, opacity:(0.7 * (1 - t)).toFixed(3)
    }));
  }

  /* Checking the voicing draws what it found. A parallel is a red line along
     each of the two voices that moved in lockstep, from the one chord to the
     next. A run with nothing to fix draws the opposite: all four voices in
     green, the length of the progression, so the shape of the lines just
     written is there to be seen — which is the thing the exercise is for.
     The stroke fills in against the clock rather than by a CSS animation,
     since every render rebuilds these and a CSS one would start over. */
  var FLOW_MS = 420, FLOW_STAGGER = 110, flowAt = null, flowFrame = false;
  function parallelVoicesAt(move){
    var voices = [];
    if (!report || !report.parallels) return voices;
    report.parallels.forEach(function(p){
      if (p.move !== move) return;
      if (voices.indexOf(p.lo) < 0) voices.push(p.lo);
      if (voices.indexOf(p.hi) < 0) voices.push(p.hi);
    });
    return voices;
  }
  function drawFlow(){
    while (layerFlow.firstChild) layerFlow.removeChild(layerFlow.firstChild);
    if (!report || flowAt == null) return;
    var rows = chordVoices();
    if (!rows) return;
    var now = performance.now(), running = false, half = glyphW("noteheadBlack", S) / 2;
    var clean = !report.errors;            /* nothing to fix — draw the lines themselves */
    var shown = 0, i, v, voices;
    for (i = 0; i + 1 < rows.length; i++){
      var a = rows[i], b = rows[i + 1];
      if (!a || !b) continue;
      voices = clean ? [0, 1, 2, 3] : parallelVoicesAt(i);
      if (!voices.length) continue;
      var t = (now - (flowAt + shown * FLOW_STAGGER)) / FLOW_MS;
      shown++;
      if (t <= 0){ running = true; continue; }        /* its turn has not come yet */
      t = Math.min(1, t);
      if (t < 1) running = true;
      var ease = 1 - Math.pow(1 - t, 3);
      voices.forEach(function(voice){
        var x1 = SLOT_X[i] + half + 3, y1 = yOf(a[voice].step, a[voice].staff);
        var x2 = SLOT_X[i + 1] - half - 3, y2 = yOf(b[voice].step, b[voice].staff);
        var len = Math.hypot(x2 - x1, y2 - y1);
        layerFlow.appendChild(el("line",{
          x1:x1, y1:y1, x2:x2, y2:y2,
          stroke: clean ? "var(--good)" : "var(--wrong)",
          "stroke-width":2.6, "stroke-linecap":"round",   /* broad, round-ended, and see-through
                                                             enough to read the staff under it */
          opacity: clean ? 0.5 : 0.58,
          "stroke-dasharray":len.toFixed(2),
          "stroke-dashoffset":(len * (1 - ease)).toFixed(2)
        }));
      });
    }
    if (running && !flowFrame){
      flowFrame = true;
      nextFrame(function(){ flowFrame = false; render(); });
    }
  }

  function noteGroup(note, opts){
    var g = el("g",{}), x = SLOT_X[note.slot], y = yOf(note.step, note.staff), color = opts.color;
    var def = STAVES[note.staff], n = ledgerCount(note.staff, note.step), i, ly;
    var half = glyphW("noteheadBlack", S) / 2;
    for (i = 1; i <= n; i++){
      ly = note.step > def.top ? yOf(def.top + i*2, note.staff) : yOf(def.bottom - i*2, note.staff);
      g.appendChild(el("line",{x1:x-half-4, y1:ly, x2:x+half+4, y2:ly,
                               stroke:color, "stroke-width":1.4}));
    }
    var acc = printedAccidental(note.slot, note.step);
    if (acc) g.appendChild(glyph(acc, x - half - 3 - glyphW(acc, S), y, S, color));
    g.appendChild(glyph("noteheadBlack", x - half, y, S, color));
    /* the stem rises from the right of the head, or falls from its left */
    var up = note.step < def.mid, sx = up ? x + half - 0.7 : x - half + 0.7;
    g.appendChild(el("line",{x1:sx, y1:y, x2:sx, y2: up ? y - 42 : y + 42,
                             stroke:color, "stroke-width":1.4}));
    if (opts.opacity != null) g.setAttribute("opacity", opts.opacity);
    var scale = opts.pop === false ? 1 : popScale(note);
    if (scale !== 1)
      g.setAttribute("transform", "translate(" + x + "," + y + ") scale(" + scale.toFixed(4) +
                     ") translate(" + (-x) + "," + (-y) + ")");
    return g;
  }

  /* ---------- staff state -------------------------------------------------- */
  var hover = null, hoverNear = false, drag = null, press = null, cursor = null;
  var keyboard = false, lastClick = null;

  var MAX_VOICES = 4;                      /* one chord, four voices */
  /* a placed note that is not one of the chord's three tones draws in red */
  function isChordTone(note){
    return chordLetters(state.chords[note.slot]).indexOf(note.step % 7) > -1;
  }
  function slotCount(slot){
    var n = 0;
    state.notes.forEach(function(x){ if (x.slot === slot) n++; });
    return n;
  }
  function slotFull(slot){ return slotCount(slot) >= MAX_VOICES; }

  function indexAt(slot, step){
    for (var i = 0; i < state.notes.length; i++)
      if (state.notes[i].slot === slot && state.notes[i].step === step) return i;
    return -1;
  }

  function render(){
    [layerNotes, layerGhost, layerSlot].forEach(function(l){
      while (l.firstChild) l.removeChild(l.firstChild);
    });
    var focus = drag ? drag.note : (hover || (keyboard ? cursor : null));
    if (focus) layerSlot.appendChild(el("rect",{x:SLOT_X[focus.slot]-22,y:44,width:44,height:172,rx:3,fill:"var(--accent-soft)"}));
    if (playingSlot != null && SLOT_X[playingSlot] != null)
      layerSlot.appendChild(el("rect",{x:SLOT_X[playingSlot]-24,y:44,width:48,height:172,rx:3,
                                       fill:"var(--accent-soft)"}));
    state.notes.forEach(function(n,i){
      if (drag && drag.note === n) return;
      layerNotes.appendChild(noteGroup(n,{
        color: n.given ? "var(--rule)" : isChordTone(n) ? "var(--ink)" : "var(--wrong)"
      }));
    });
    if (drag) layerGhost.appendChild(noteGroup(drag.note,{color:"var(--accent)",pop:false}));
    else if (focus && indexAt(focus.slot, focus.step) === -1 && !slotFull(focus.slot))
      layerGhost.appendChild(noteGroup(focus,{color:"var(--accent)",opacity:0.55,pop:false}));

    /* A full chord takes no more notes; a cross over its column clears it.
       Only while the pointer is in that column, though — the nearest chord
       is picked with no bound on distance, and a cross should not be offered
       from the far side of the staff. */
    var nearColumn = keyboard || hoverNear;
    var cueSlot = (focus && !drag && nearColumn && slotFull(focus.slot)) ? focus.slot : null;
    if (cueSlot != null && SLOT_X[cueSlot] != null){
      var cue = el("text",{x:SLOT_X[cueSlot], y:55, "text-anchor":"middle", "font-size":14,
                           fill:"var(--wrong)", "font-family":"IBM Plex Sans, sans-serif"});
      var hint = el("title",{});
      hint.textContent = "Clear this chord";
      cue.appendChild(hint);
      cue.appendChild(document.createTextNode("\u2715"));
      layerGhost.appendChild(cue);
    }
    updateVoices();
    drawLabels();
    drawFlow();
    drawRipple();
    drawFading();
    renderChips();
    if (report && reportKey !== notesKey()) report = null;   /* edited since — stale */
    if (!report) flowAt = null;
    renderReport();
    var ready = allVoiced();
    checkBtn.hidden = !ready;
    /* Play stays up throughout, so a part-written progression can be heard;
       an empty chord simply passes in silence */
    playBtn.disabled = !state.notes.length;
    if (!state.notes.length && playTimer) stopPlayback();
    checkHint.textContent = ready
      ? "Doubling, spacing, crossing, the leading tone and parallels."
      : (state.chords.length && slotCount(0) < MAX_VOICES)
        ? "The opening chord needs all four voices \u2014 it names them for the rest."
        : "Every chord needs its own tones \u2014 three notes or four, none of them foreign \u2014 " +
          "before the checklist can run.";
  }

  var chips = document.getElementById("chips");
  var checkBtn = document.getElementById("check"), checkHint = document.getElementById("checkhint");
  var playBtn = document.getElementById("play");
  playBtn.addEventListener("click", playProgression);
  checkBtn.addEventListener("click", function(){
    report = runChecks();
    reportKey = notesKey();
    flowAt = performance.now() - (reducedMotion() ? 1e6 : 0);
    render();          /* starts the lines drawing; renderReport alone would not */
    document.getElementById("results").scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  function renderChips(){
    /* playing a chord re-renders, which throws away the very button that was
       pressed — so the keyboard keeps its place across the rebuild */
    var held = document.activeElement, heldSlot = held && held.className &&
      String(held.className).indexOf("chip") > -1 ? held.getAttribute("data-slot") : null;
    chips.innerHTML = "";
    var rows = chordVoices();
    var bySlot = {}, any = false;
    state.notes.forEach(function(n){ (bySlot[n.slot] = bySlot[n.slot] || []).push(n); any = true; });
    if (!any){
      var p = document.createElement("li");
      p.className = "empty";
      p.textContent = "Nothing placed yet — click a line or a space under any chord.";
      chips.appendChild(p);
      return;
    }
    Object.keys(bySlot).map(Number).sort(function(a,b){return a-b;}).forEach(function(slot){
      var li = document.createElement("li");
      /* A chord that is right can be heard on its own from here; one still
         being built has nothing to play, so the chip is simply inert. */
      var box = document.createElement("button");
      box.type = "button";
      box.className = "chip" + (slot === playingSlot ? " playing" : "");
      box.setAttribute("data-slot", slot);
      if (chordIsClean(slot)){
        box.title = "Play this chord";
        box.addEventListener("click", function(){ playSlot(slot); });
      } else {
        box.disabled = true;
      }
      var b = document.createElement("b");
      numeralInto(b, slot);
      var s = document.createElement("span");
      var row = rows && rows[slot];
      if (row){
        row.forEach(function(n, voice){          /* bass up, so a crossing reads plainly */
          var part = document.createElement("span");
          part.className = "voiced";
          var tag = document.createElement("i");
          tag.textContent = VOICE_SHORT[voice];
          tag.title = VOICES[voice];
          part.appendChild(tag);
          part.appendChild(document.createTextNode(n.name));
          s.appendChild(part);
        });
      } else {
        s.textContent = bySlot[slot].map(function(n){ return n.step; })
          .sort(function(a,b){return a-b;})
          .map(function(step){ return nameAt(slot, step); }).join("  ");
      }
      box.appendChild(b); box.appendChild(s);
      li.appendChild(box);
      chips.appendChild(li);
      if (heldSlot != null && +heldSlot === slot && !box.disabled)
        box.focus({preventScroll:true});
    });
  }

  /* ---------- the checklist ----------------------------------------------
     The rules are written for four named voices, but a placed note carries
     no voice, so each chord's notes are read bottom up as Bass, Tenor, Alto,
     Soprano. That assumes the voices do not cross, which is the same
     assumption the spacing and parallel rules are stated under. */
  var VOICES = ["Bass", "Tenor", "Alto", "Soprano"];
  var VOICE_SHORT = ["B", "T", "A", "S"];
  var ROLES = ["root", "third", "fifth"];

  /* Name an interval the way a theory class would: the diatonic distance
     gives the number, the semitones give the quality. */
  var ORDINALS = ["unison","second","third","fourth","fifth","sixth","seventh","octave","ninth",
                  "tenth","eleventh","twelfth","thirteenth","fourteenth","double octave"];
  var MAJOR_SEMIS = [0,2,4,5,7,9,11];
  function intervalName(low, high){
    var dia = high.step - low.step, semi = high.midi - low.midi;
    if (dia < 0) return null;
    var expected = MAJOR_SEMIS[dia % 7] + 12 * Math.floor(dia / 7), off = semi - expected;
    var perfect = (dia % 7 === 0 || dia % 7 === 3 || dia % 7 === 4);   /* unison, fourth, fifth */
    var quality = off === 0 ? (perfect ? "perfect" : "major")
                : off === -1 ? (perfect ? "diminished" : "minor")
                : off === 1 ? "augmented"
                : (off === -2 && !perfect) ? "diminished" : null;
    var name = ORDINALS[dia] || (dia + 1) + "th";
    return quality ? quality + " " + name : name;
  }
  function withArticle(str){ return (/^[aeiou]/i.test(str) ? "an " : "a ") + str; }

  function voicesOf(slot){
    return state.notes.filter(function(n){ return n.slot === slot; })
      .map(function(n){
        return { step:n.step, letter:n.step % 7, staff:n.staff,
                 midi:midiAt(slot, n.step), name:nameAt(slot, n.step) };
      })
      .sort(function(a, b){ return a.midi - b.midi; });
  }
  /* Once the opening chord is right — four voices, every one of them a tone
     of the chord, all three tones present — its notes are named top down:
     soprano, alto, tenor, bass. Read fresh on every render, so moving a note
     renames whatever it has become. */
  /* Four voices, every one a tone of the chord, with the root and the third
     both there. The fifth may be left out — four parts will not always hold
     three tones and a sensible doubling, and dropping the fifth is the usual
     way out. The root and the third are what name the chord, so neither can
     go — and neither can the fifth of a diminished triad, which is the
     interval the chord is named for. */
  function needsFifth(slot){ return quality(state.chords[slot]) === "dim"; }
  function chordIsClean(slot){
    var count = slotCount(slot);
    if (slot >= state.chords.length || count < 3 || count > MAX_VOICES) return false;
    var notes = notesIn(slot), tones = chordLetters(state.chords[slot]), seen = {}, i, letter;
    for (i = 0; i < notes.length; i++){
      letter = notes[i].step % 7;
      if (tones.indexOf(letter) === -1) return false;          /* a note outside the chord */
      seen[letter] = true;
    }
    return !!(seen[tones[0]] && seen[tones[1]] && (!needsFifth(slot) || seen[tones[2]]));
  }
  /* the letters name four parts, so they wait for four notes */
  function firstChordVoices(){
    return (chordIsClean(0) && slotCount(0) === MAX_VOICES) ? voicesOf(0) : null;
  }
  /* The opening chord fixes the voices. Every later chord's four notes are
     then matched to those same four lines by the assignment that moves them
     least — ties going to the one with fewest crossings — so a voice keeps
     its name even where it crosses another, and the checks below follow the
     line rather than the pitch order. */
  var PERMS = (function(){
    var out = [];
    [0,1,2,3].forEach(function(a){
      [0,1,2,3].forEach(function(b){
        [0,1,2,3].forEach(function(c){
          [0,1,2,3].forEach(function(d){
            if (new Set([a,b,c,d]).size === 4) out.push([a,b,c,d]);
          });
        });
      });
    });
    return out;
  })();

  function pitchOf(n){ return midiAt(n.slot, n.step); }   /* works on a raw placed note */
  function matchVoices(prev, notes){
    var best = null, bestCost = Infinity, bestCross = Infinity;
    PERMS.forEach(function(perm){
      var cost = 0, cross = 0, v, w;
      for (v = 0; v < 4; v++) cost += Math.abs(pitchOf(notes[perm[v]]) - pitchOf(prev[v]));
      for (v = 0; v < 4; v++)
        for (w = v + 1; w < 4; w++)
          if (pitchOf(notes[perm[v]]) > pitchOf(notes[perm[w]])) cross++;
      if (cost < bestCost || (cost === bestCost && cross < bestCross)){
        bestCost = cost; bestCross = cross; best = perm;
      }
    });
    return best.map(function(idx){ return notes[idx]; });
  }

  /* A voice is carried by the note itself, not worked out afresh from the
     pitch order each time. The opening chord is always re-read top down, as
     the chord that fixes them; a later chord takes its voices when it first
     fills up, and then keeps them — so dragging a note past another inside
     that chord leaves it the voice it was, crossing and all. Losing a note
     unfixes that chord until it is whole again. */
  function notesIn(slot){
    return state.notes.filter(function(n){ return n.slot === slot; })
      .sort(function(a, b){ return midiAt(slot, a.step) - midiAt(slot, b.step); });
  }
  function voiceRowOf(slot){
    var notes = notesIn(slot), row = [], i;
    if (notes.length !== MAX_VOICES) return null;
    for (i = 0; i < notes.length; i++){
      if (notes[i].voice == null) return null;
      row[notes[i].voice] = notes[i];
    }
    for (i = 0; i < MAX_VOICES; i++) if (!row[i]) return null;   /* tags clashed */
    return row;
  }
  function updateVoices(){
    var prev = null, slot, notes, row, i;
    for (slot = 0; slot < state.chords.length; slot++){
      notes = notesIn(slot);
      if (notes.length !== MAX_VOICES){
        notes.forEach(function(n){ n.voice = null; });
        prev = null;
        continue;
      }
      row = slot === 0 ? null : voiceRowOf(slot);      /* the first chord always re-reads */
      if (!row){
        row = prev ? matchVoices(prev, notes) : notes; /* ascending, so bass first */
        row.forEach(function(n, v){ n.voice = v; });
      }
      prev = row;
    }
  }
  /* one row per chord, each indexed by voice: 0 Bass, 1 Tenor, 2 Alto, 3 Soprano */
  function chordVoices(){
    if (!firstChordVoices()) return null;            /* nothing has fixed them yet */
    var rows = [], slot, row;
    for (slot = 0; slot < state.chords.length; slot++){
      row = voiceRowOf(slot);
      rows.push(row ? row.map(function(n){
        return { step:n.step, letter:n.step % 7, staff:n.staff,
                 midi:midiAt(slot, n.step), name:nameAt(slot, n.step) };
      }) : null);
    }
    return rows;
  }

  /* Once a chord is right — four voices, all of them chord tones, all three
     tones there — the lowest sounding note figures it: the root takes none,
     the third makes it a six, the fifth a six-four. Anything short of that
     goes unfigured; the checklist says why. */
  function inversionOf(slot){
    if (!chordIsClean(slot)) return "";      /* no figure for a chord that is not yet right */
    var at = chordLetters(state.chords[slot]).indexOf(notesIn(slot)[0].step % 7);
    return at === 1 ? "6" : at === 2 ? "64" : "";
  }
  function figureNode(fig){
    var f = document.createElement("span");
    f.className = "fig";
    fig.split("").forEach(function(d){
      var digit = document.createElement("i");
      digit.textContent = d;
      f.appendChild(digit);
    });
    return f;
  }
  function numeralInto(node, slot){
    node.appendChild(document.createTextNode(numeralOf(state.chords[slot])));
    var fig = inversionOf(slot);
    if (fig) node.appendChild(figureNode(fig));
  }
  /* The checklist is about voice leading, so it waits until every chord is a
     chord: its own tones, nothing foreign, nothing missing. The opening
     chord is held to four notes whatever else it has, since it is the chord
     that names the voices the rest are read against. */
  function allVoiced(){
    if (!state.chords.length || slotCount(0) !== MAX_VOICES) return false;
    for (var i = 0; i < state.chords.length; i++) if (!chordIsClean(i)) return false;
    return true;
  }

  function runChecks(){
    var report = { blocks:[], parallels:[], errors:0, cautions:0 };
    function block(label, sub){
      var b = { label:label, sub:sub || "", items:[] };
      report.blocks.push(b);
      return function(level, text, strong){
        b.items.push({ level:level, text:text, strong:strong });
        if (level === "error") report.errors++;
        else if (level === "caution") report.cautions++;
      };
    }

    var rows = chordVoices();
    function voicesAt(slot){ return (rows && rows[slot]) || voicesOf(slot); }

    state.chords.forEach(function(degree, slot){
      var v = voicesAt(slot), tones = chordLetters(degree), counts = {};
      var add = block([slot], spell(degree));
      v.forEach(function(n){ counts[n.letter] = (counts[n.letter] || 0) + 1; });

      /* completeness — the fifth is the one tone that may be left out */
      tones.forEach(function(l, idx){
        if (counts[l]) return;
        if (idx < 2){
          add("error", "Missing its " + ROLES[idx] + ", " + letterText(degree, l) + ".");
        } else if (needsFifth(slot)){
          add("error", "Missing its fifth, " + letterText(degree, l) +
              " \u2014 a diminished triad cannot do without it; the diminished fifth is what makes it one.");
        } else if (counts[tones[0]] > 2){
          add("ok", "No fifth, root tripled \u2014 the usual way to leave it out.");
        } else {
          add("caution", "No fifth, and the root is not tripled \u2014 when the fifth goes, " +
              "the root normally takes its place.");
        }
      });

      /* doubling, and the third as the weaker double */
      tones.forEach(function(l, idx){
        if (!(counts[l] > 1)) return;
        var what = (counts[l] > 2 ? "Three copies of the " : "Doubles the ") +
                   ROLES[idx] + ", " + letterText(degree, l);
        if (idx === 1) add("caution", what + " \u2014 the weaker double; the root or the fifth is the safer choice.");
        else add("ok", what + ".");
      });

      /* the leading tone doubled in a dominant */
      if (degree === 5 && counts[leadingLetter()] > 1)
        add("caution", "The leading tone " + letterText(degree, leadingLetter()) +
            " is doubled \u2014 watch it on the next move: one copy still has to rise.");

      if (v.length < MAX_VOICES && v.length >= 3)
        add("ok", v.length + " voices \u2014 spacing, crossing and the parallel checks want a fourth.");

      /* a lower voice sounding above the one named over it */
      if (v.length === MAX_VOICES){
        for (var lower = 0; lower + 1 < MAX_VOICES; lower++){
          if (v[lower].midi > v[lower + 1].midi)
            add("error", VOICES[lower] + " is above the " + VOICES[lower + 1] + " (" +
                v[lower].name + " over " + v[lower + 1].name + ") \u2014 the voices have crossed.");
        }
      }

      /* spacing: the two upper gaps only */
      if (v.length === MAX_VOICES){
        [[3, 2], [2, 1]].forEach(function(pair){
          var hi = v[pair[0]], lo = v[pair[1]], gap = hi.midi - lo.midi;
          if (gap <= 12) return;
          var named = intervalName(lo, hi);
          add("error", VOICES[pair[0]] + " and " + VOICES[pair[1]] + " are " +
              (named ? withArticle(named) : gap + " semitones") + " apart \u2014 " +
              lo.name + " to " + hi.name + ", " + gap +
              " semitones \u2014 keep adjacent upper voices within an octave.",
              named || (gap + " semitones"));
        });
      }
    });

    /* what happens between one chord and the next */
    for (var i = 0; i + 1 < state.chords.length; i++){
      var a = voicesAt(i), b = voicesAt(i + 1);
      var add = block([i, " \u2192 ", i + 1]);
      if (a.length !== MAX_VOICES || b.length !== MAX_VOICES) continue;

      /* parallel fifths and octaves across all six pairs. Only the same
         perfect interval twice over, both voices moving the same way:
         contrary and oblique motion into one is left alone, and so are
         hidden fifths and octaves. */
      for (var lo = 0; lo < 4; lo++){
        for (var hi = lo + 1; hi < 4; hi++){
          var before = (a[hi].midi - a[lo].midi) % 12, after = (b[hi].midi - b[lo].midi) % 12;
          if (before !== after || (before !== 0 && before !== 7)) continue;
          var dLo = Math.sign(b[lo].midi - a[lo].midi), dHi = Math.sign(b[hi].midi - a[hi].midi);
          if (dLo === 0 || dLo !== dHi) continue;
          add("error", "Parallel " + (before === 7 ? "fifths" : "octaves") + ": " +
              VOICES[lo] + " and " + VOICES[hi] + " move " + a[lo].name + "\u2013" + a[hi].name +
              " to " + b[lo].name + "\u2013" + b[hi].name + ".",
              "Parallel " + (before === 7 ? "fifths" : "octaves"));
          report.parallels.push({ move:i, lo:lo, hi:hi });
        }
      }

      /* the leading tone, whenever a dominant goes to the tonic */
      if (state.chords[i] === 5 && state.chords[i + 1] === 1){
        var lt = leadingLetter(), tonic = tonicLetter(), fifth = chordLetters(1)[2];
        var carriers = [];
        a.forEach(function(n, idx){ if (n.letter === lt) carriers.push(idx); });
        var rises = function(idx){
          return b[idx].step === a[idx].step + 1 && b[idx].letter === tonic;
        };
        var dropsToFifth = function(idx){
          return b[idx].letter === fifth && b[idx].step < a[idx].step;
        };
        var risers = carriers.filter(rises);
        if (carriers.length === 1 && !risers.length){
          add("error", "The leading tone (" + a[carriers[0]].name + ", " + VOICES[carriers[0]] +
              ") has to rise to the tonic; it goes to " + b[carriers[0]].name + ".");
        } else if (carriers.length > 1){
          if (!risers.length){
            add("error", "The leading tone is doubled and neither copy rises to the tonic \u2014 one of them must.");
          } else {
            carriers.forEach(function(idx){
              if (rises(idx) || dropsToFifth(idx)) return;
              add("error", "The second leading tone (" + a[idx].name + ", " + VOICES[idx] +
                  ") goes to " + b[idx].name + " \u2014 with one copy rising, the other must rise too or " +
                  "drop to the fifth of the tonic, " + letterText(1, fifth) + ".");
            });
          }
        }
      }
    }
    return report;
  }

  /* ---------- reporting it ------------------------------------------------ */
  var report = null, reportKey = "";
  function notesKey(){
    return state.notes.map(function(n){ return n.slot + ":" + n.step; }).sort().join(",") +
           "|" + state.chords.join("") + "|" + state.tonic + state.mode;
  }
  function renderReport(){
    var box = document.getElementById("results");
    if (!report){ box.hidden = true; return; }
    box.hidden = false;
    var verdict = document.getElementById("verdict");
    if (!report.errors && !report.cautions) verdict.textContent = "All clear.";
    else {
      var parts = [];
      if (report.errors) parts.push(report.errors + (report.errors === 1 ? " thing to fix" : " things to fix"));
      if (report.cautions) parts.push(report.cautions + " to watch");
      verdict.textContent = parts.join(", ") + ".";
    }
    var list = document.getElementById("findings");
    list.innerHTML = "";
    report.blocks.forEach(function(b){
      if (!b.items.length) return;
      var li = document.createElement("li");
      li.className = "block";
      var label = document.createElement("b");
      b.label.forEach(function(part){
        if (typeof part === "number") numeralInto(label, part);
        else label.appendChild(document.createTextNode(part));
      });
      if (b.sub){
        var sub = document.createElement("small");
        sub.textContent = b.sub;
        label.appendChild(sub);
      }
      var ul = document.createElement("ul");
      b.items.forEach(function(item){
        var row = document.createElement("li");
        row.className = item.level;
        var cut = item.strong ? item.text.indexOf(item.strong) : -1;
        if (cut < 0) row.textContent = item.text;
        else {
          var strong = document.createElement("b");
          strong.textContent = item.strong;
          row.appendChild(document.createTextNode(item.text.slice(0, cut)));
          row.appendChild(strong);
          row.appendChild(document.createTextNode(item.text.slice(cut + item.strong.length)));
        }
        ul.appendChild(row);
      });
      li.appendChild(label); li.appendChild(ul);
      list.appendChild(li);
    });
    if (!list.children.length){
      var li2 = document.createElement("li");
      li2.className = "block";
      li2.innerHTML = "<b>\u2713</b><ul><li class=\"ok\">Every chord complete, spacing within an octave, " +
                      "no parallels and every leading tone resolved.</li></ul>";
      list.appendChild(li2);
    }
  }

  var actx = null, piano = {}, pianoNotes = [];

  function audio(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { return null; }

    }
    if (actx.state === "suspended" && actx.resume) actx.resume();
    return actx;
  }
  function loadPiano(){
    Object.keys(PIANO).forEach(function(midi){
      var raw = atob(PIANO[midi]), bytes = new Uint8Array(raw.length), i;
      for (i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      try {
        actx.decodeAudioData(bytes.buffer, function(buffer){
          piano[midi] = buffer;
          pianoNotes = Object.keys(piano).map(Number).sort(function(a,b){ return a-b; });
        }, function(){ /* undecodable here — the fallback tone covers it */ });
      } catch (e) { /* same */ }
    });

     all silent. A chord is heard when it is asked for: Play, or its chip. */
  /* `hold` caps how long the note rings, in milliseconds. Playback passes
     the beat, so the chords stay distinct at a fast tempo instead of piling
     up — a sample runs 2.4 seconds, which is seven chords deep at 168. */
  function play(slot, step, hold){

    if (!ctx) return;
    var midi = midiAt(slot, step), t = ctx.currentTime;
    if (!pianoNotes.length) return playTone(ctx, freqAt(slot, step), t);
    var near = pianoNotes.reduce(function(a, b){
      return Math.abs(b - midi) < Math.abs(a - midi) ? b : a;
    });
    var src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = piano[near];
    src.playbackRate.value = Math.pow(2, (midi - near) / 12);

    var dur = src.buffer.duration / src.playbackRate.value;
    if (hold) dur = Math.min(dur, hold / 1000);
    g.gain.setValueAtTime(0.85, t);
    g.gain.setValueAtTime(0.85, t + dur * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + dur * 0.97);

     it sounds. */

      case "ArrowDown":  moveCursor(-1); break;
      case "ArrowLeft":  cursor.slot = clamp(cursor.slot - 1, 0, state.chords.length - 1); break;
      case "ArrowRight": cursor.slot = clamp(cursor.slot + 1, 0, state.chords.length - 1); break;
      case "Enter": case " ":
        i = indexAt(cursor.slot, cursor.step);
        if (i > -1 && state.notes[i].given) break;      /* not yours to take off */
        if (i > -1) state.notes.splice(i, 1);
        else if (!slotFull(cursor.slot)){
          state.notes.push({slot:cursor.slot, step:cursor.step, staff:cursor.staff});
          startPop(cursor.slot, cursor.step, cursor.staff);
        }
        break;
      case "Backspace": case "Delete":
        i = indexAt(cursor.slot, cursor.step);
        if (i > -1 && !state.notes[i].given) state.notes.splice(i, 1);
        break;
      default: handled = false;
    }
    if (!handled) return;
    e.preventDefault();
    keyboard = true; hover = null; render();
  });
  wrap.addEventListener("focus", function(){ keyboard = true; render(); });
  wrap.addEventListener("blur", function(){ keyboard = false; render(); });

  /* ---------- setup menu ----------------------------------------------------- */
  var setup = document.getElementById("setup"), stage = document.getElementById("stage");
  var circle = document.getElementById("circle"), seq = document.getElementById("seq");
  var numerals = document.getElementById("numerals"), keyline = document.getElementById("keyline");
  var begin = document.getElementById("begin"), startnote = document.getElementById("startnote");
  var MAX_CHORDS = 8;

  /* ---- circle of fifths ---------------------------------------------------
     Twelve wedges, a fifth apart clockwise: majors outside, their relative
     minors inside. Six o'clock carries the enharmonic pair, so clicking the
     wedge you are already on flips its spelling.                          */
  var CIRCLE = [
    {maj:["C"],            min:["A"]},
    {maj:["G"],            min:["E"]},
    {maj:["D"],            min:["B"]},
    {maj:["A"],            min:["F♯"]},
    {maj:["E"],            min:["C♯"]},
    {maj:["B"],            min:["G♯"]},
    {maj:["F♯","G♭"], min:["D♯","E♭"]},
    {maj:["D♭"],           min:["B♭"]},
    {maj:["A♭"],           min:["F"]},
    {maj:["E♭"],           min:["C"]},
    {maj:["B♭"],           min:["G"]},
    {maj:["F"],            min:["D"]}
  ];
  var CX = 160, CY = 160;

  function polar(r, deg){
    var a = deg * Math.PI / 180;
    return [CX + r * Math.sin(a), CY - r * Math.cos(a)];
  }
  function wedge(rOut, rIn, i){
    var a0 = i*30 - 15, a1 = i*30 + 15;
    return "M" + polar(rOut,a0) + "A" + rOut + "," + rOut + " 0 0 1 " + polar(rOut,a1) +
           "L" + polar(rIn,a1) + "A" + rIn + "," + rIn + " 0 0 0 " + polar(rIn,a0) + "Z";
  }
  function circlePos(){
    for (var i = 0; i < CIRCLE.length; i++)
      if (CIRCLE[i][state.mode === "major" ? "maj" : "min"].indexOf(state.tonic) > -1) return i;
    return 0;
  }
  function chooseKey(mode, names){
    var at = names.indexOf(state.tonic);
    if (state.mode === mode && at > -1 && names.length > 1) state.tonic = names[(at + 1) % names.length];
    else { state.mode = mode; state.tonic = names[0]; }
    drawSetup();
  }
  function accOf(mode, name){
    var list = KEYS[mode], i;
    for (i = 0; i < list.length; i++) if (list[i][0] === name) return list[i][1];
    return 0;
  }
  /* the key signature as notation: clef plus its accidentals on a small stave */
  function miniStave(acc){
    var g = el("g",{role:"img","aria-label":"Key signature: " + sigCount(acc)});
    var sp = 6, top = 162, n = Math.abs(acc), kind = acc > 0 ? "sharp" : "flat";
    var wClef = glyphW("gClef", sp), wAcc = glyphW(kind, sp) + 1, i;
    var left = CX - (wClef + n * wAcc) / 2;
    for (i = 0; i < 5; i++)
      g.appendChild(el("line",{x1:left - 4, y1:top + i*sp, x2:left + wClef + n*wAcc + 4, y2:top + i*sp,
                               stroke:"var(--rule)", "stroke-width":0.7}));
    g.appendChild(glyph("gClef", left, top + 3*sp, sp, "var(--ink)"));   /* G line */
    for (i = 0; i < n; i++)
      g.appendChild(glyph(kind, left + wClef + 2 + i*wAcc,
                          top + (38 - SIG_STEPS[kind].treble[i]) * sp / 2, sp, "var(--ink)"));
    return g;
  }
  function drawCircle(){
    circle.innerHTML = "";
    var here = circlePos();
    var svgC = el("svg",{viewBox:"0 0 320 320", "class":"circle", role:"group",
                         "aria-label":"Circle of fifths — choose a key"});
    CIRCLE.forEach(function(pos, i){
      [["major",150,108,pos.maj,15,""],["minor",104,64,pos.min,12.5,"m"]].forEach(function(ring){
        var mode = ring[0], names = ring[3];
        var name = names.indexOf(state.tonic) > -1 ? state.tonic : names[0];
        var sel = state.mode === mode && names.indexOf(state.tonic) > -1;
        var acc = accOf(mode, name), mid = (ring[1] + ring[2]) / 2;
        var g = el("g",{ "class":"sector" + (sel ? " sel" : (i === here ? " rel" : "")),
                         tabindex:0, role:"button", "aria-pressed":String(sel),
                         "aria-label":name + " " + mode + ", " + sigCount(acc) });
        g.appendChild(el("path",{d:wedge(ring[1], ring[2], i)}));
        /* names and counts stack in screen space, not along the radius, so
           they never crowd each other on the wedges out at the sides */
        var lp = polar(mid, i*30);
        function text(str, dy, size, cls){
          var t = el("text",{x:lp[0], y:lp[1] + dy, "text-anchor":"middle", "font-size":size,
                             "font-family":cls ? "IBM Plex Sans, sans-serif" : "Spectral, Georgia, serif"});
          if (cls) t.setAttribute("class", cls);
          t.textContent = str;
          g.appendChild(t);
        }
        if (names.length > 1){                       /* the enharmonic wedge */
          text(names[0] + ring[5], -4, ring[4] - 2.5);
          text(names[1] + ring[5], 11, ring[4] - 2.5);
        } else {
          text(name + ring[5], mode === "major" ? -1 : 4, ring[4]);
          if (mode === "major")
            text(acc === 0 ? "—" : Math.abs(acc) + (acc > 0 ? "♯" : "♭"), 13, 9, "count");
        }
        g.addEventListener("click", function(){ chooseKey(mode, names); });
        g.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " "){ e.preventDefault(); chooseKey(mode, names); }
        });
        svgC.appendChild(g);
      });
    });
    /* hub: the key, and its signature written out on a small treble stave */
    svgC.appendChild(el("circle",{cx:CX, cy:CY, r:60, fill:"var(--surface)", stroke:"var(--line)"}));
    var t = el("text",{x:CX, y:140, "text-anchor":"middle", "font-size":17,
                       "font-family":"Spectral, Georgia, serif", fill:"var(--ink)"});
    t.textContent = keyName();
    svgC.appendChild(t);
    svgC.appendChild(miniStave(keyAcc()));
    circle.appendChild(svgC);
  }
  function drawNumerals(){
    numerals.innerHTML = "";
    DEGREES.forEach(function(degree){
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = numeralOf(degree) + "<small>" + spell(degree) + "</small>";
      b.disabled = state.chords.length >= MAX_CHORDS;
      b.addEventListener("click", function(){
        if (state.chords.length < MAX_CHORDS){ state.chords.push(degree); drawSetup(); }
      });
      numerals.appendChild(b);
    });
  }
  function drawSeq(){
    seq.innerHTML = "";
    if (!state.chords.length){
      var p = document.createElement("span");
      p.className = "none";
      p.textContent = "Tap a numeral above to start the progression.";
      seq.appendChild(p);
      return;
    }
    state.chords.forEach(function(degree, i){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "slot";
      b.title = "Remove this chord";
      b.innerHTML = "<span>" + numeralOf(degree) + "</span><small>" + spell(degree) + "</small>";
      b.addEventListener("click", function(){ state.chords.splice(i,1); drawSetup(); });
      seq.appendChild(b);
    });
  }
  function drawSetup(){
    /* keep the tonic legal when the mode flips */
    var names = KEYS[state.mode].map(function(k){ return k[0]; });
    if (names.indexOf(state.tonic) === -1) state.tonic = state.mode === "major" ? "C" : "A";
    drawCircle(); drawNumerals(); drawSeq();
    var progline = document.getElementById("progline");
    progline.hidden = state.mode !== "minor";
    progline.innerHTML = "<b>V</b> and <b>vii\u00B0</b> raise the leading tone; the rest stay diatonic to the natural minor scale.";
    /* relative keys share a signature, so pick the spelling that matches it:
       G-flat major pairs with E-flat minor, F-sharp major with D-sharp minor */
    var relMode = state.mode === "major" ? "minor" : "major";
    var cands = CIRCLE[circlePos()][relMode === "major" ? "maj" : "min"];
    var relName = cands.filter(function(n){ return accOf(relMode, n) === keyAcc(); })[0] || cands[0];
    var rel = relName + " " + relMode;
    keyline.innerHTML = "Scale: <b>" + scaleText() + "</b> · Relative " + rel +
      (CIRCLE[circlePos()].maj.length > 1 ? " · Click the same wedge again for the other spelling." : "");
    begin.disabled = state.chords.length < 2;
    startnote.textContent = state.chords.length < 2
      ? "Pick at least two chords."
      : state.chords.length + " chords — " + state.chords.map(numeralOf).join(" – ") +
        " in " + keyName() + ".";
  }

  document.getElementById("undo").addEventListener("click", function(){ state.chords.pop(); drawSetup(); });
  document.getElementById("clearprog").addEventListener("click", function(){ state.chords = []; drawSetup(); });

  var TASK = {
    bass:"<b>The bass is given.</b> Write the tenor, alto and soprano above it. Each numeral " +
         "takes its figure from that bass note once its chord is right.",
    soprano:"<b>The soprano is given.</b> Harmonise it \u2014 alto, tenor and bass under each " +
            "note. The figures follow whatever bass you write."
  };
  function enterStage(){
    SLOT_X = layoutSlots();
    stopPlayback();
    state.live = state.mode + "|" + state.tonic + "|" + state.chords.join(",");
    cursor = { slot:0, step:30, staff:"treble" };
    document.getElementById("stagekey").textContent = keyName();
    document.getElementById("stageprog").textContent = state.chords.map(numeralOf).join(" – ");
    var task = document.getElementById("stagetask");
    task.hidden = !state.drill;
    if (state.drill) task.innerHTML = TASK[state.drill];
    document.getElementById("again").hidden = !state.drill;
    audio();                 /* decode the samples while the staff is drawn */
    setup.hidden = true;
    stage.hidden = false;
    drawStaff();
    render();
    wrap.focus({preventScroll:true});
  }
  /* A drill: a key, a progression and one voice already on the staff. */
  function startDrill(kind){
    var key = makeKey();
    state.mode = key.mode;
    state.tonic = key.tonic;
    state.chords = makeProgression();
    state.drill = kind;
    var line = kind === "bass" ? makeBass(state.chords) : makeSoprano(state.chords);
    state.notes = line.map(function(step, slot){
      return { slot:slot, step:step, staff:(kind === "bass" ? "bass" : "treble"), given:true };
    });
    enterStage();
  }
  document.getElementById("drill-bass").addEventListener("click", function(){ startDrill("bass"); });
  document.getElementById("drill-sop").addEventListener("click", function(){ startDrill("soprano"); });
  document.getElementById("again").addEventListener("click", function(){ startDrill(state.drill); });

  begin.addEventListener("click", function(){
    var sig = state.mode + "|" + state.tonic + "|" + state.chords.join(",");
    if (sig !== state.live){ state.notes = []; state.drill = null; }   /* a changed setup starts clean */
    enterStage();
  });
  document.getElementById("edit").addEventListener("click", function(){
    stopPlayback();
    stage.hidden = true;
    setup.hidden = false;
    drawSetup();
  });

  /* ---------- toolbar --------------------------------------------------------- */
  document.getElementById("btn-clear").addEventListener("click", function(){ clearNotes(); });

  drawSetup();
})();
</script>
</body>
</html>
